[package]
name = "otacast"
version = "0.1.0"
description = "OTACast S3 Uploader"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }
dotenvy = "0.15"
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
aws-config = "1.5"
aws-sdk-s3 = "1.49"
aws-smithy-types = { version = "1", features = ["http-body-1-x"] }
aws-smithy-http-client = { version = "1", features = ["rustls-aws-lc"] }
aws-smithy-runtime-api = { version = "1", features = ["client"] }
bytes = "1"
http-body = "1"
md-5 = "0.10"
hex = "0.4"
base64 = "0.22"
sha2 = "0.10"
tempfile = "3"
thiserror = "1.0"
dotenvy = "0.15"
url = "2"

[profile.release]
codegen-units = 1
lto = true
