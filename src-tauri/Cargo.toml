[package]
name = "otacast"
version = "0.1.0"
description = "OTACast S3 Uploader"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
aws-config = "1.5"
aws-sdk-s3 = "1.49"
md-5 = "0.10"
hex = "0.4"
base64 = "0.22"
thiserror = "1.0"

[profile.release]
codegen-units = 1
lto = true
